# =============================================================================
# Manut — Neon PR database branches (Depot CI)
#
# Adapted from Neon's "Create/Delete Branch for Pull Request" GitHub Action
# template. Live CI is Depot (repo Actions is disabled); keep this file under
# `.depot/workflows/`.
#
# On open / reopen / synchronize: create (or reuse) a Neon branch from the
# project primary, then run Drizzle migrate with the UNPOOLED URL.
# On close: delete the Neon branch.
#
# Parent DB must already be bootstrapped (see docs/ops/NEON_STAGING.md). PR
# branches copy schema — do NOT run db:bootstrap-greenfield here.
#
# Required Depot secrets / vars:
#   secrets.NEON_API_KEY
#   vars.NEON_PROJECT_ID
# Parent branch: Neon project primary (omit override unless primary is non-default).
# =============================================================================

name: Neon PR Branches

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed
    branches: [main, preview, production]

concurrency:
  group: neon-pr-branches-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  setup:
    name: Setup
    if: ${{ vars.NEON_PROJECT_ID != '' }}
    outputs:
      branch: ${{ steps.branch_name.outputs.current_branch }}
      neon_branch: ${{ steps.names.outputs.neon_branch }}
    runs-on: depot-ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Get branch name
        id: branch_name
        uses: tj-actions/branch-names@v8

      - name: Neon branch name
        id: names
        run: |
          # Keep names short — Neon has a 63-char limit on branch names.
          raw="preview/pr-${{ github.event.number }}-${{ steps.branch_name.outputs.current_branch }}"
          safe="$(echo "$raw" | tr '/_' '-' | cut -c1-63)"
          echo "neon_branch=${safe}" >> "$GITHUB_OUTPUT"

  create_neon_branch:
    name: Create Neon Branch
    needs: setup
    if: |
      vars.NEON_PROJECT_ID != '' &&
      github.event_name == 'pull_request' && (
        github.event.action == 'synchronize' ||
        github.event.action == 'opened' ||
        github.event.action == 'reopened'
      )
    runs-on: depot-ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Skip when API key unset
        if: ${{ secrets.NEON_API_KEY == '' }}
        run: |
          echo "::notice::NEON_API_KEY unset — Neon PR branch create skipped. See docs/ops/NEON_STAGING.md."
          exit 0

      - name: Get branch expiration (14 days)
        if: ${{ secrets.NEON_API_KEY != '' }}
        id: get_expiration_date
        run: echo "EXPIRES_AT=$(date -u --date '+14 days' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Create Neon Branch
        if: ${{ secrets.NEON_API_KEY != '' }}
        id: create_neon_branch
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: ${{ needs.setup.outputs.neon_branch }}
          # Omit parent → project primary (staging). Set Depot var NEON_PARENT_BRANCH
          # only if the primary is not the Neon default.
          api_key: ${{ secrets.NEON_API_KEY }}
          database: neondb
          role: neondb_owner
          ssl: require
          expires_at: ${{ env.EXPIRES_AT }}

      - uses: actions/checkout@v6
        if: ${{ secrets.NEON_API_KEY != '' }}

      - uses: ./.depot/actions/setup-workspace
        if: ${{ secrets.NEON_API_KEY != '' }}
        with:
          turbo-cache-key: neon-pr-branches
          prisma: "false"

      - name: Drizzle migrate (Neon PR branch, unpooled)
        if: ${{ secrets.NEON_API_KEY != '' }}
        env:
          # create-branch-action@v6 outputs db_url (unpooled) and db_url_pooled.
          # Migrate must use unpooled. Strip channel_binding for postgres.js.
          DATABASE_URL: ${{ steps.create_neon_branch.outputs.db_url }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::create-branch-action did not return db_url"
            exit 1
          fi
          # Strip channel_binding=require (Neon console appends it; postgres.js / Hyperdrive dislike it)
          export DATABASE_URL="$(echo "$DATABASE_URL" | sed -E 's/[?&]channel_binding=require//g' | sed -E 's/\?&/?/g' | sed -E 's/\?$//')"
          pnpm --filter @nexora/db db:migrate
          # Idempotency pass (same as local verify recipe)
          pnpm --filter @nexora/db db:migrate

      # Optional: post schema diff on the PR. Needs pull-requests: write.
      # Uncomment when NEON_API_KEY is live and you want review comments:
      #
      # permissions (job-level):
      #   contents: read
      #   pull-requests: write
      #
      # - name: Post Schema Diff Comment to PR
      #   uses: neondatabase/schema-diff-action@v1
      #   with:
      #     project_id: ${{ vars.NEON_PROJECT_ID }}
      #     compare_branch: ${{ needs.setup.outputs.neon_branch }}
      #     api_key: ${{ secrets.NEON_API_KEY }}

  delete_neon_branch:
    name: Delete Neon Branch
    needs: setup
    if: |
      vars.NEON_PROJECT_ID != '' &&
      github.event_name == 'pull_request' &&
      github.event.action == 'closed'
    runs-on: depot-ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Skip when API key unset
        if: ${{ secrets.NEON_API_KEY == '' }}
        run: |
          echo "::notice::NEON_API_KEY unset — Neon PR branch delete skipped."
          exit 0

      - name: Delete Neon Branch
        if: ${{ secrets.NEON_API_KEY != '' }}
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: ${{ needs.setup.outputs.neon_branch }}
          api_key: ${{ secrets.NEON_API_KEY }}
