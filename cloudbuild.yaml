# Full CI/CD pipeline for Intranet
# Builds and deploys both frontend and backend to Cloud Run
steps:
  # ============================================
  # Step 1: Build and push API image
  # ============================================
  - name: "gcr.io/cloud-builders/docker"
    id: "build-api"
    args:
      - "build"
      - "-f"
      - "docker/Dockerfile.api"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/api:${SHORT_SHA}"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/api:latest"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    id: "push-api"
    waitFor: ["build-api"]
    args:
      - "push"
      - "--all-tags"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/api"

  # ============================================
  # Step 2: Build and push Web image
  # ============================================
  - name: "gcr.io/cloud-builders/docker"
    id: "build-web"
    args:
      - "build"
      - "-f"
      - "docker/Dockerfile.web"
      - "--build-arg"
      - "NEXT_PUBLIC_SUPABASE_URL=${_SUPABASE_URL}"
      - "--build-arg"
      - "NEXT_PUBLIC_SUPABASE_ANON_KEY=${_SUPABASE_ANON_KEY}"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/web:${SHORT_SHA}"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/web:latest"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    id: "push-web"
    waitFor: ["build-web"]
    args:
      - "push"
      - "--all-tags"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/web"

  # ============================================
  # Step 3: Deploy API to Cloud Run
  # ============================================
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "deploy-api"
    waitFor: ["push-api"]
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "nexora-api"
      - "--image"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/api:${SHORT_SHA}"
      - "--region"
      - "${_REGION}"
      - "--platform"
      - "managed"
      - "--allow-unauthenticated"
      - "--port"
      - "3001"
      - "--memory"
      - "512Mi"
      - "--cpu"
      - "1"
      - "--min-instances"
      - "0"
      - "--max-instances"
      - "10"
      - "--cpu-boost"
      - "--set-env-vars"
      - "NODE_ENV=production,NEXT_PUBLIC_SUPABASE_URL=${_SUPABASE_URL},GCP_PROJECT_ID=${PROJECT_ID},GCS_BUCKET=${_GCS_BUCKET}"
      - "--set-secrets"
      - "DATABASE_URL=DATABASE_URL:latest,DIRECT_URL=DIRECT_URL:latest,SUPABASE_SERVICE_ROLE_KEY=SUPABASE_SERVICE_ROLE_KEY:latest,ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest,EMAIL_SERVICE_API_KEY=EMAIL_SERVICE_API_KEY:latest,EMAIL_SERVICE_URL=EMAIL_SERVICE_URL:latest,CRON_SECRET=CRON_SECRET:latest"

  # ============================================
  # Step 4: Deploy Web to Cloud Run
  # ============================================
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "deploy-web"
    waitFor: ["push-web", "deploy-api"]
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "nexora-web"
      - "--image"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/web:${SHORT_SHA}"
      - "--region"
      - "${_REGION}"
      - "--platform"
      - "managed"
      - "--allow-unauthenticated"
      - "--port"
      - "3000"
      - "--memory"
      - "512Mi"
      - "--cpu"
      - "1"
      - "--min-instances"
      - "0"
      - "--max-instances"
      - "10"
      - "--cpu-boost"
      - "--set-env-vars"
      - "NODE_ENV=production,API_URL=${_API_URL}"

substitutions:
  _REGION: asia-southeast1
  _REPOSITORY: nexora
  _SUPABASE_URL: ""
  _SUPABASE_ANON_KEY: ""
  _API_URL: https://nexora-api-xxxxxxxxxx-as.a.run.app
  _GCS_BUCKET: nexora-tbh-uploads

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/api:${SHORT_SHA}"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/api:latest"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/web:${SHORT_SHA}"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/web:latest"
