packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  "@prisma/client": false
  "@prisma/engines": true
  # Funding-only postinstall; runtime files are already published.
  core-js: false
  # Optional native DTrace integration inherited through the EAS CLI.
  dtrace-provider: false
  esbuild: true
  # The published test runtime does not require its advisory postinstall.
  msw: false
  prisma: false
  sharp: true
  # OpenCollective-only postinstall; OCR runtime files are already published.
  tesseract.js: false
  unrs-resolver: true
  # Wrangler needs workerd's platform binary installation.
  workerd: true
strictDepBuilds: true
blockExoticSubdeps: true
minimumReleaseAge: 1440
minimumReleaseAgeStrict: false
overrides:
  "fast-uri@<=3.1.1": "3.1.2"
  "brace-expansion@>=5.0.0 <5.0.6": "5.0.6"
  "ip-address@<=10.1.0": "10.1.1"
  "postcss@<8.5.10": "8.5.10"
  "protobufjs@<=7.6.2": "7.6.3"
  "qs@>=6.11.1 <=6.15.1": "6.15.2"
  "uuid@<11.1.1": "11.1.1"
  "ws@>=8.0.0 <8.21.0": "8.21.0"
  "hono@<4.12.25": "4.12.30"
  "dompurify@<=3.4.10": "3.4.11"
  "vite@<8.0.16": "8.0.16"
  "esbuild@<0.28.1": "0.28.1"
  "@opentelemetry/core@<2.8.0": "2.8.0"
  "form-data@>=4.0.0 <4.0.6": "4.0.6"
  "undici@>=7.0.0 <7.28.0": "7.28.0"
  "@babel/core@<=7.29.0": "7.29.6"
  "js-yaml@<=4.1.1": "4.2.0"
  # Dependabot/OSV (2026-07-18): transitive eas-cli / prisma.dev / web quill chain
  "@xmldom/xmldom@<0.8.13": "0.8.13"
  "@hono/node-server@<1.19.13": "1.19.14"
  "minimatch@>=5.0.0 <5.1.8": "5.1.9"
minimumReleaseAgeExclude:
  - "@cloudflare/workers-types@5.20260716.1"
  - "@eslint-zod/utils@2.4.0"
  - "@supabase/auth-js@2.110.7"
  - "@supabase/functions-js@2.110.7"
  - "@supabase/postgrest-js@2.110.7"
  - "@supabase/realtime-js@2.110.7"
  - "@supabase/storage-js@2.110.7"
  - "@supabase/supabase-js@2.110.7"
  - eslint-plugin-zod@4.8.0
  - "@expo/cli@57.0.9"
  - "@expo/metro-config@57.0.6"
  - "@expo/prebuild-config@57.0.8"
  - expo-asset@57.0.6
  - expo-constants@57.0.6
  - expo-modules-autolinking@57.0.8
  - expo-modules-core@57.0.6
  - expo@57.0.7
  - "@expo/metro-runtime@57.0.6"
  - "@expo/ui@57.0.7"
  - expo-router@57.0.7
