# =============================================================================
# Intranet - Deploy to GCP Cloud Run Staging
# Triggers on push to preview
# =============================================================================

name: Deploy to Staging

on:
  push:
    branches: [preview]
    # Docs/agent markdown never need new Cloud Run images (~9–10 min saved per merge).
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".agents/**"
  workflow_dispatch:

concurrency:
  group: deploy-staging-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_ID: tbh-nexora
  REGION: asia-southeast1
  REPOSITORY: nexora
  API_SERVICE: nexora-api-staging
  WEB_SERVICE: nexora-web-staging

jobs:
  # ===========================================================================
  # Job 0a: Preflight — are the secrets this workflow references populated?
  #
  # A secret that does not exist is NOT an error in GitHub Actions: `${{
  # secrets.MISSING }}` expands to an empty string, `--set-env-vars` then sets
  # `KEY=`, and the deploy goes green with the variable defined-but-empty. The
  # feature code reads the blank, decides it is unconfigured and disables
  # itself — so a merged feature is silently absent on staging with nothing
  # anywhere reporting red. That is what happened to the Project workflow
  # e-mail action links (WORKFLOW_EMAIL_TOKEN_SECRET), which
  # `actionLinksEnabled()` drops unless the secret is at least 16 chars.
  #
  # REQUIRED holds the secrets that are populated today: if one is ever
  # deleted, renamed or rotated to empty, this fails the deploy instead of
  # shipping a half-configured API.
  #
  # ADVISORY holds the ones that are empty *right now*. They cannot be
  # required without blocking every deploy until someone with org-admin
  # rights fills them in, so they are reported in the job summary on every
  # run. Move a name from ADVISORY to REQUIRED as soon as it is set — that is
  # the whole point of the split, not a permanent parking space.
  #
  # Only secret NAMES are ever printed. Never echo a value.
  # ===========================================================================
  preflight-secrets:
    name: Preflight — secrets populated
    runs-on: ubuntu-latest
    steps:
      - name: Check referenced secrets are non-empty
        env:
          # -- deploy plumbing --
          WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          # -- staging database + auth --
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STAGING_DIRECT_URL: ${{ secrets.STAGING_DIRECT_URL }}
          STAGING_NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_NEXT_PUBLIC_SUPABASE_URL }}
          STAGING_NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_NEXT_PUBLIC_APP_URL: ${{ secrets.STAGING_NEXT_PUBLIC_APP_URL }}
          # -- shared service credentials --
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_SERVICE_API_KEY: ${{ secrets.EMAIL_SERVICE_API_KEY }}
          EMAIL_SERVICE_URL: ${{ secrets.EMAIL_SERVICE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REDIRECT_URI: ${{ secrets.GOOGLE_OAUTH_REDIRECT_URI }}
          INTEGRATIONS_TOKEN_KEY: ${{ secrets.INTEGRATIONS_TOKEN_KEY }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
          VALIDATOR_MONITOR_GITHUB_TOKEN: ${{ secrets.VALIDATOR_MONITOR_GITHUB_TOKEN }}
          BOT_API_CLIENT_ID: ${{ secrets.BOT_API_CLIENT_ID }}
          FX_FALLBACK_API_KEY: ${{ secrets.FX_FALLBACK_API_KEY }}
          # -- advisory: empty in this repo as of 2026-08-14 --
          STAGING_WORKFLOW_EMAIL_TOKEN_SECRET: ${{ secrets.STAGING_WORKFLOW_EMAIL_TOKEN_SECRET }}
          MARKETING_ANALYTICS_API_URL: ${{ secrets.MARKETING_ANALYTICS_API_URL }}
          MARKETING_ANALYTICS_PARTNER_IDS: ${{ secrets.MARKETING_ANALYTICS_PARTNER_IDS }}
          MARKETING_ANALYTICS_BACKFILL_FROM: ${{ secrets.MARKETING_ANALYTICS_BACKFILL_FROM }}
          BOT_API_BASE_URL: ${{ secrets.BOT_API_BASE_URL }}
          BOT_FX_CURRENCIES: ${{ secrets.BOT_FX_CURRENCIES }}
          BOT_FX_UNITS: ${{ secrets.BOT_FX_UNITS }}
          FX_FALLBACK_ENABLED: ${{ secrets.FX_FALLBACK_ENABLED }}
          FX_FALLBACK_BASE_URL: ${{ secrets.FX_FALLBACK_BASE_URL }}
          LEAVE_NOTIFICATION_EXCLUDE: ${{ secrets.LEAVE_NOTIFICATION_EXCLUDE }}
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ secrets.POSTHOG_PROJECT_ID }}
          # -- Web Push (VAPID). Unset today: the API logs a warning and every
          #    send becomes a no-op, so a missing key deploys green and silently
          #    leaves push off. Advisory until the secrets exist, then promote.
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: |
          set -uo pipefail

          REQUIRED="
            WIF_PROVIDER GCP_SERVICE_ACCOUNT
            STAGING_DATABASE_URL STAGING_DIRECT_URL
            STAGING_NEXT_PUBLIC_SUPABASE_URL STAGING_NEXT_PUBLIC_SUPABASE_ANON_KEY
            STAGING_SUPABASE_SERVICE_ROLE_KEY STAGING_NEXT_PUBLIC_APP_URL
            ANTHROPIC_API_KEY GEMINI_API_KEY
            EMAIL_SERVICE_API_KEY EMAIL_SERVICE_URL CRON_SECRET
            GOOGLE_OAUTH_CLIENT_ID GOOGLE_OAUTH_CLIENT_SECRET GOOGLE_OAUTH_REDIRECT_URI
            INTEGRATIONS_TOKEN_KEY
            POSTHOG_API_KEY POSTHOG_HOST NEXT_PUBLIC_POSTHOG_KEY
            VALIDATOR_MONITOR_GITHUB_TOKEN BOT_API_CLIENT_ID FX_FALLBACK_API_KEY
          "

          ADVISORY="
            STAGING_WORKFLOW_EMAIL_TOKEN_SECRET
            MARKETING_ANALYTICS_API_URL MARKETING_ANALYTICS_PARTNER_IDS
            MARKETING_ANALYTICS_BACKFILL_FROM
            BOT_API_BASE_URL BOT_FX_CURRENCIES BOT_FX_UNITS
            FX_FALLBACK_ENABLED FX_FALLBACK_BASE_URL
            LEAVE_NOTIFICATION_EXCLUDE
            POSTHOG_PERSONAL_API_KEY POSTHOG_PROJECT_ID
            VAPID_PUBLIC_KEY VAPID_PRIVATE_KEY VAPID_SUBJECT
          "

          missing_required=""
          for name in $REQUIRED; do
            [ -z "${!name:-}" ] && missing_required="$missing_required $name"
          done

          missing_advisory=""
          for name in $ADVISORY; do
            [ -z "${!name:-}" ] && missing_advisory="$missing_advisory $name"
          done

          {
            echo "## Staging secret preflight"
            echo
            if [ -n "$missing_advisory" ]; then
              echo "### Empty (advisory)"
              echo
              echo "Deployed as \`KEY=\`, so the feature behind each one is off on staging:"
              echo
              for name in $missing_advisory; do echo "- \`$name\`"; done
              echo
              echo "Populate these, then move the name into REQUIRED in this workflow."
            else
              echo "All advisory secrets are populated — move them into REQUIRED."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          for name in $missing_advisory; do
            echo "::warning title=Empty secret::$name is empty — the feature that reads it is disabled on staging"
          done

          if [ -n "$missing_required" ]; then
            for name in $missing_required; do
              echo "::error title=Missing required secret::$name is empty or unset"
            done
            echo "A secret that does not exist expands to an empty string and would deploy as KEY=."
            echo "Refusing to ship a half-configured API. Set the secret, or move the name to"
            echo "ADVISORY in .github/workflows/deploy-staging.yml if it is genuinely optional."
            exit 1
          fi

          echo "All required secrets are populated."

  # ===========================================================================
  # Job 0: PR Checks (type-check, lint, test)
  # ===========================================================================
  pr-checks:
    name: PR Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Type check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

  # ===========================================================================
  # Job 1: Detect which deploy targets changed (skip expensive Docker builds when possible)
  # ===========================================================================
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    # Gating `changes` gates both deploys: each is guarded by
    # `needs.changes.outputs.*`, and a failed dependency leaves those outputs
    # empty, so the `== 'true'` tests are false and the jobs skip. That holds
    # even for deploy-web-staging, whose `if:` starts with `always()`.
    needs: [pr-checks, preflight-secrets]
    outputs:
      # Informational, for the summary. The DEPLOY decision is `deploy`.
      api: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.api }}
      web: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.web }}
      # Is this commit still the branch tip? See the Deploy gate step.
      fresh: ${{ steps.gate.outputs.fresh }}
      # The single gate BOTH deploys use, so a run can never ship one
      # service without the other.
      deploy: ${{ steps.gate.outputs.deploy }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Path filter
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'packages/database/**'
              - 'packages/types/**'
              - 'packages/utils/**'
              - 'docker/Dockerfile.api'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - '.github/workflows/deploy-staging.yml'
            web:
              - 'apps/web/**'
              - 'packages/ui/**'
              - 'packages/types/**'
              - 'packages/utils/**'
              - 'docker/Dockerfile.web'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - '.github/workflows/deploy-staging.yml'

      # ── Deploy gate: freshness + atomicity ────────────────────────────
      #
      # Two guards, because the 2026-08-26 staging break needed BOTH to fail.
      #
      # 1. FRESHNESS. `concurrency: cancel-in-progress` does not help here: it
      #    cancels runs that are IN PROGRESS, and on a busy runner pool two
      #    pushes can both sit QUEUED for many minutes. On 2026-08-26 the
      #    older commit's run was created 9s first, waited 18 minutes for a
      #    runner, and therefore deployed AFTER the newer run had finished —
      #    rolling the web service backwards. Cloud Run serves whichever
      #    revision was written last, so queue order decides what ships.
      #    A run whose commit is no longer the branch tip must not deploy;
      #    the run for the tip will.
      #
      # 2. ATOMICITY. The per-service path filters let one run deploy only
      #    ONE service, which is version skew, not a partial rollout: the
      #    two halves share an API contract. That is what actually broke the
      #    board — #1160 touched only `docker/Dockerfile.web`, so its stale
      #    run redeployed the web while the API kept the newer revision, and
      #    the old bundle called seven endpoints the new API had removed
      #    (7x 404, every column empty). The same skew needs no race at all:
      #    an api-only PR that deletes a route would break the live web
      #    immediately. So a run now ships BOTH services or neither.
      #
      # Computed in shell rather than in nested `${{ }}` expressions on
      # purpose — GitHub expressions yield values, not booleans, and a subtly
      # wrong one here fails OPEN and deploys. Same reasoning as the
      # preflight-secrets job above.
      - name: Deploy gate
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          API_CHANGED: ${{ steps.filter.outputs.api }}
          WEB_CHANGED: ${{ steps.filter.outputs.web }}
          BRANCH: ${{ github.ref_name }}
          THIS_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # A failed query must be LOUD, not read as "no tip". `cut` would
          # otherwise mask a non-zero ls-remote behind an empty string.
          if ! remote=$(git ls-remote origin "refs/heads/${BRANCH}"); then
            echo "::error::Could not read refs/heads/${BRANCH} — refusing to guess."
            exit 1
          fi
          tip=$(printf '%s\n' "$remote" | cut -f1)

          echo "branch      : ${BRANCH}"
          echo "this commit : ${THIS_SHA}"
          echo "branch tip  : ${tip:-<none>}"

          fresh=true
          if [ -z "$tip" ]; then
            # Branch gone (deleted / force-pushed away). Deploying a commit
            # that is no longer on the branch is never what anyone wanted.
            fresh=false
            echo "::warning::${BRANCH} no longer exists — skipping deploy."
          elif [ "$tip" != "$THIS_SHA" ]; then
            fresh=false
            echo "::warning::Superseded by ${tip} — skipping deploy. The run for that commit deploys instead."
          fi

          changed=false
          if [ "$EVENT" = "workflow_dispatch" ] \
            || [ "$API_CHANGED" = "true" ] || [ "$WEB_CHANGED" = "true" ]; then
            changed=true
          fi

          deploy=false
          if [ "$fresh" = "true" ] && [ "$changed" = "true" ]; then
            deploy=true
          fi

          echo "fresh=${fresh}"   >> "$GITHUB_OUTPUT"
          echo "deploy=${deploy}" >> "$GITHUB_OUTPUT"
          echo "gate: fresh=${fresh} changed=${changed} -> deploy=${deploy}"

  # ===========================================================================
  # Job 2: Deploy API to Staging
  # ===========================================================================
  deploy-api-staging:
    name: 🚀 Deploy API to Staging
    needs: changes
    # Coupled with the web deploy — see the Deploy gate step.
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    outputs:
      api_url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install database deps
        run: pnpm install --filter @nexora/database --frozen-lockfile

      # Staging is a throwaway, db:push-synced environment (never migrate-deploy
      # like prod). --accept-data-loss lets the sync reconcile drift — e.g. orphan
      # tables left on staging that are no longer in the schema — instead of
      # aborting the whole deploy. Prod is unaffected: it runs prisma migrate
      # deploy in deploy.yml, not db:push. NEVER point this step at the prod DB.
      - name: Sync staging database schema
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.STAGING_DIRECT_URL }}
        run: pnpm db:push:staging

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build API Docker image
        run: |
          docker build \
            -f docker/Dockerfile.api \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/api-staging:${{ github.sha }} \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/api-staging:latest \
            .

      # Boot the image we just built and wait for /health before it is allowed
      # anywhere near Cloud Run.
      #
      # Two container-boot failures reached staging on 2026-08-14 — Node 20
      # missing the native WebSocket @supabase/supabase-js 2.112 needs, and
      # Next 16 tracing only half of @swc/helpers. Neither was visible to
      # type-check, lint or the test suite, because none of those boot a
      # container. Both were found by reading Cloud Run logs AFTER a failed
      # deploy. This step moves that discovery left.
      #
      # The container gets the same env the deploy uses. Nothing here connects
      # to the database: /health does not query, and both the Prisma and
      # Supabase clients construct without dialling out — the crash we are
      # catching happens at import time, well before any of that.
      - name: Smoke-test API image
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/api-staging:${{ github.sha }}
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.STAGING_DIRECT_URL }}
          SUPABASE_URL: ${{ secrets.STAGING_NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -uo pipefail
          docker run -d --name api-smoke -p 3001:3001 \
            -e NODE_ENV=staging \
            -e PORT=3001 \
            -e DATABASE_URL \
            -e DIRECT_URL \
            -e NEXT_PUBLIC_SUPABASE_URL="$SUPABASE_URL" \
            -e SUPABASE_SERVICE_ROLE_KEY \
            "$IMAGE"

          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3001/health > /dev/null 2>&1; then
              ok=1
              echo "API answered /health after ${i} attempt(s)."
              break
            fi
            # A container that has already exited will never answer; fail fast
            # rather than burning the full minute.
            if [ -z "$(docker ps -q -f name=api-smoke)" ]; then
              echo "::error title=API image failed to boot::container exited before serving /health"
              break
            fi
            sleep 2
          done

          if [ "$ok" -ne 1 ]; then
            echo "----- container logs -----"
            docker logs api-smoke 2>&1 | tail -60
            docker rm -f api-smoke > /dev/null 2>&1 || true
            echo "::error title=API smoke test failed::the built image does not serve /health; refusing to deploy it"
            exit 1
          fi

          docker rm -f api-smoke > /dev/null 2>&1 || true

      - name: Push API image to Artifact Registry
        run: |
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/api-staging:${{ github.sha }}
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/api-staging:latest

      - name: Deploy API to Cloud Run Staging
        id: deploy
        run: |
          set +e
          attempt=1
          max_attempts=3
          while true; do
            gcloud run deploy ${{ env.API_SERVICE }} \
              --image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/api-staging:${{ github.sha }} \
              --region=${{ env.REGION }} \
              --platform=managed \
              --allow-unauthenticated \
              --port=3001 \
              --memory=512Mi \
              --cpu=1 \
              --min-instances=0 \
              --max-instances=10 \
              --cpu-boost \
              --set-env-vars="^|^NODE_ENV=staging|NEXT_PUBLIC_SUPABASE_URL=${{ secrets.STAGING_NEXT_PUBLIC_SUPABASE_URL }}|DATABASE_URL=${{ secrets.STAGING_DATABASE_URL }}|DIRECT_URL=${{ secrets.STAGING_DIRECT_URL }}|SUPABASE_SERVICE_ROLE_KEY=${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}|ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}|GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}|EMAIL_SERVICE_API_KEY=${{ secrets.EMAIL_SERVICE_API_KEY }}|EMAIL_SERVICE_URL=${{ secrets.EMAIL_SERVICE_URL }}|CRON_SECRET=${{ secrets.CRON_SECRET }}|LEAVE_NOTIFICATION_EXCLUDE=${{ secrets.LEAVE_NOTIFICATION_EXCLUDE }}|NEXT_PUBLIC_APP_URL=${{ secrets.STAGING_NEXT_PUBLIC_APP_URL }}|PORTAL_URL=https://staging-intranet.thebinaryholdings.com|WORKFLOW_EMAIL_TOKEN_SECRET=${{ secrets.STAGING_WORKFLOW_EMAIL_TOKEN_SECRET }}|CORS_ALLOWED_ORIGINS=https://staging-intranet.thebinaryholdings.com,https://nexora-web-staging-fsuqhbfimq-as.a.run.app,https://nexora-web-staging-739241936816.asia-southeast1.run.app|GOOGLE_OAUTH_CLIENT_ID=${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}|GOOGLE_OAUTH_CLIENT_SECRET=${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}|GOOGLE_OAUTH_REDIRECT_URI=${{ secrets.GOOGLE_OAUTH_REDIRECT_URI }}|INTEGRATIONS_TOKEN_KEY=${{ secrets.INTEGRATIONS_TOKEN_KEY }}|POSTHOG_API_KEY=${{ secrets.POSTHOG_API_KEY }}|POSTHOG_HOST=${{ secrets.POSTHOG_HOST }}|POSTHOG_PERSONAL_API_KEY=${{ secrets.POSTHOG_PERSONAL_API_KEY }}|POSTHOG_PROJECT_ID=${{ secrets.POSTHOG_PROJECT_ID }}|VALIDATOR_MONITOR_GITHUB_TOKEN=${{ secrets.VALIDATOR_MONITOR_GITHUB_TOKEN }}|GOOGLE_SHEETS_SA_KEY=${{ secrets.GOOGLE_SHEETS_SA_KEY }}|OW_TRACTION_SHEET_ID=${{ secrets.OW_TRACTION_SHEET_ID }}|OW_TRACTION_SHEET_RANGE=${{ secrets.OW_TRACTION_SHEET_RANGE }}|BOT_API_CLIENT_ID=${{ secrets.BOT_API_CLIENT_ID }}|BOT_API_BASE_URL=${{ secrets.BOT_API_BASE_URL }}|BOT_FX_CURRENCIES=${{ secrets.BOT_FX_CURRENCIES }}|BOT_FX_UNITS=${{ secrets.BOT_FX_UNITS }}|FX_FALLBACK_ENABLED=${{ secrets.FX_FALLBACK_ENABLED }}|FX_FALLBACK_BASE_URL=${{ secrets.FX_FALLBACK_BASE_URL }}|FX_FALLBACK_API_KEY=${{ secrets.FX_FALLBACK_API_KEY }}|MARKETING_ANALYTICS_API_URL=${{ secrets.MARKETING_ANALYTICS_API_URL }}|MARKETING_ANALYTICS_PARTNER_IDS=${{ secrets.MARKETING_ANALYTICS_PARTNER_IDS }}|MARKETING_ANALYTICS_BACKFILL_FROM=${{ secrets.MARKETING_ANALYTICS_BACKFILL_FROM }}|ACCOUNTING_FIXED_ASSETS=true|MARKETING_ANALYTICS_ENABLED=true|VAPID_PUBLIC_KEY=${{ secrets.VAPID_PUBLIC_KEY }}|VAPID_PRIVATE_KEY=${{ secrets.VAPID_PRIVATE_KEY }}|VAPID_SUBJECT=${{ secrets.VAPID_SUBJECT }}"
            rc=$?
            if [ "$rc" -eq 0 ]; then break; fi
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::gcloud run deploy failed after $attempt attempts (last exit $rc)"
              exit "$rc"
            fi
            echo "Deploy attempt $attempt failed (exit $rc); retrying in 15s..."
            attempt=$((attempt + 1))
            sleep 15
          done
          set -e

          API_URL=$(gcloud run services describe ${{ env.API_SERVICE }} --region=${{ env.REGION }} --format='value(status.url)')
          echo "url=$API_URL" >> $GITHUB_OUTPUT
          echo "API Staging deployed to: $API_URL"

  # ===========================================================================
  # Job 3: Deploy Web to Staging (depends on API)
  # ===========================================================================
  deploy-web-staging:
    name: Deploy Web to Staging
    runs-on: ubuntu-latest
    needs: [changes, deploy-api-staging]
    if: |
      always() &&
      needs.changes.outputs.deploy == 'true' &&
      (needs.deploy-api-staging.result == 'success' || needs.deploy-api-staging.result == 'skipped')
    permissions:
      contents: read
      id-token: write

    outputs:
      web_url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Resolve API URL
        id: api_url
        run: |
          set -euo pipefail
          API_URL="${{ needs.deploy-api-staging.outputs.api_url }}"
          if [ -z "$API_URL" ]; then
            echo "deploy-api-staging skipped; reading existing Cloud Run API URL"
            API_URL=$(gcloud run services describe ${{ env.API_SERVICE }} \
              --region=${{ env.REGION }} \
              --format='value(status.url)')
          fi
          if [ -z "$API_URL" ]; then
            echo "::error::Could not resolve API URL for web deploy"
            exit 1
          fi
          echo "url=$API_URL" >> "$GITHUB_OUTPUT"
          echo "API_URL (runtime rewrite target) will be: ${API_URL}"

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build Web Docker image
        run: |
          docker build \
            -f docker/Dockerfile.web \
            --build-arg NEXT_PUBLIC_SUPABASE_URL=${{ secrets.STAGING_NEXT_PUBLIC_SUPABASE_URL }} \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.STAGING_NEXT_PUBLIC_SUPABASE_ANON_KEY }} \
            --build-arg API_URL=${{ steps.api_url.outputs.url }} \
            --build-arg NEXT_PUBLIC_POSTHOG_KEY=${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }} \
            --build-arg NEXT_PUBLIC_POSTHOG_HOST=/ingest \
            --build-arg NEXT_PUBLIC_VAPID_PUBLIC_KEY="${{ secrets.VAPID_PUBLIC_KEY }}" \
            --build-arg NEXT_PUBLIC_ACCOUNTING_FIXED_ASSETS=true \
            --build-arg NEXT_PUBLIC_MARKETING_ANALYTICS_ENABLED=true \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/web-staging:${{ github.sha }} \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/web-staging:latest \
            .

      # Same guard for web. Next 16's standalone output dropped half of
      # @swc/helpers and the container died at boot; the image built cleanly,
      # so nothing upstream of Cloud Run noticed.
      - name: Smoke-test Web image
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/web-staging:${{ github.sha }}
          API_TARGET: ${{ steps.api_url.outputs.url }}
        run: |
          set -uo pipefail
          docker run -d --name web-smoke -p 3000:3000 \
            -e NODE_ENV=production \
            -e PORT=3000 \
            -e HOSTNAME=0.0.0.0 \
            -e API_URL="$API_TARGET" \
            "$IMAGE"

          ok=0
          for i in $(seq 1 30); do
            # -L because / redirects to /sign-in; any 2xx means the server is up.
            if curl -fsSL http://localhost:3000/ > /dev/null 2>&1; then
              ok=1
              echo "Web answered after ${i} attempt(s)."
              break
            fi
            if [ -z "$(docker ps -q -f name=web-smoke)" ]; then
              echo "::error title=Web image failed to boot::container exited before serving a request"
              break
            fi
            sleep 2
          done

          if [ "$ok" -ne 1 ]; then
            echo "----- container logs -----"
            docker logs web-smoke 2>&1 | tail -60
            docker rm -f web-smoke > /dev/null 2>&1 || true
            echo "::error title=Web smoke test failed::the built image does not serve a request; refusing to deploy it"
            exit 1
          fi

          docker rm -f web-smoke > /dev/null 2>&1 || true

      - name: Push Web image to Artifact Registry
        run: |
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/web-staging:${{ github.sha }}
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/web-staging:latest

      - name: Deploy Web to Cloud Run Staging
        id: deploy
        run: |
          set +e
          attempt=1
          max_attempts=3
          while true; do
            gcloud run deploy ${{ env.WEB_SERVICE }} \
              --image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/web-staging:${{ github.sha }} \
              --region=${{ env.REGION }} \
              --platform=managed \
              --allow-unauthenticated \
              --port=3000 \
              --memory=512Mi \
              --cpu=1 \
              --min-instances=0 \
              --max-instances=10 \
              --cpu-boost \
              --set-env-vars="NODE_ENV=staging,API_URL=${{ steps.api_url.outputs.url }}"
            rc=$?
            if [ "$rc" -eq 0 ]; then break; fi
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::gcloud run deploy failed after $attempt attempts (last exit $rc)"
              exit "$rc"
            fi
            echo "Deploy attempt $attempt failed (exit $rc); retrying in 15s..."
            attempt=$((attempt + 1))
            sleep 15
          done
          set -e

          WEB_URL=$(gcloud run services describe ${{ env.WEB_SERVICE }} --region=${{ env.REGION }} --format='value(status.url)')
          echo "url=$WEB_URL" >> $GITHUB_OUTPUT
          echo "Web Staging deployed to: $WEB_URL"

  # ===========================================================================
  # Job 4: Staging Deployment Summary
  # ===========================================================================
  staging-summary:
    name: Staging Deployment Summary
    runs-on: ubuntu-latest
    needs: [changes, deploy-api-staging, deploy-web-staging]
    if: always()

    steps:
      - name: Print staging deployment URLs
        run: |
          echo "Staging Deployment Summary"
          echo "============================"
          echo "Deploy gate: deploy=${{ needs.changes.outputs.deploy }} (commit is branch tip: ${{ needs.changes.outputs.fresh }})"
          if [ "${{ needs.changes.outputs.fresh }}" = "false" ]; then
            echo "  -> SUPERSEDED: nothing was deployed by this run, on purpose."
          fi
          echo "API Staging deploy: ${{ needs.deploy-api-staging.result }} (changed: ${{ needs.changes.outputs.api }})"
          echo "Web Staging deploy: ${{ needs.deploy-web-staging.result }} (changed: ${{ needs.changes.outputs.web }})"
          echo "API Staging URL: ${{ needs.deploy-api-staging.outputs.api_url || 'unchanged (deploy skipped)' }}"
          echo "Web Staging URL: ${{ needs.deploy-web-staging.outputs.web_url || 'unchanged (deploy skipped)' }}"
          echo "============================"
