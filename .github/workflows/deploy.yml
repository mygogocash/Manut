# =============================================================================
# Intranet - Deploy to GCP Cloud Run
# Triggers on push to production
# =============================================================================

name: Deploy to GCP Cloud Run

on:
  push:
    branches: [production]
    # Docs/agent markdown never need new Cloud Run images (~9–10 min saved per merge).
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".agents/**"
  workflow_dispatch:

concurrency:
  group: deploy-cloud-run-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_ID: tbh-nexora
  REGION: asia-southeast1
  REPOSITORY: nexora
  API_SERVICE: nexora-api
  WEB_SERVICE: nexora-web

jobs:
  # ===========================================================================
  # Detect which deploy targets changed (skip expensive Docker builds when possible)
  # ===========================================================================
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      # Informational, for the summary. The DEPLOY decision is `deploy`.
      api: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.api }}
      web: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.web }}
      # Is this commit still the branch tip? See the Deploy gate step.
      fresh: ${{ steps.gate.outputs.fresh }}
      # The single gate BOTH deploys use, so a run can never ship one
      # service without the other.
      deploy: ${{ steps.gate.outputs.deploy }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Path filter
        # v4 runs on Node 24 (v3 was Node 20, deprecated on the runner
        # 2026-06-16). Same filters/outputs API. dorny/paths-filter#294.
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'packages/database/**'
              - 'packages/types/**'
              - 'packages/utils/**'
              - 'docker/Dockerfile.api'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - '.github/workflows/deploy.yml'
            web:
              - 'apps/web/**'
              - 'packages/ui/**'
              - 'packages/types/**'
              - 'packages/utils/**'
              - 'docker/Dockerfile.web'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - '.github/workflows/deploy.yml'

      # ── Deploy gate: freshness + atomicity ────────────────────────────
      #
      # Two guards, because the 2026-08-26 staging break needed BOTH to fail.
      #
      # 1. FRESHNESS. `concurrency: cancel-in-progress` does not help here: it
      #    cancels runs that are IN PROGRESS, and on a busy runner pool two
      #    pushes can both sit QUEUED for many minutes. On 2026-08-26 the
      #    older commit's run was created 9s first, waited 18 minutes for a
      #    runner, and therefore deployed AFTER the newer run had finished —
      #    rolling the web service backwards. Cloud Run serves whichever
      #    revision was written last, so queue order decides what ships.
      #    A run whose commit is no longer the branch tip must not deploy;
      #    the run for the tip will.
      #
      # 2. ATOMICITY. The per-service path filters let one run deploy only
      #    ONE service, which is version skew, not a partial rollout: the
      #    two halves share an API contract. That is what actually broke the
      #    board — #1160 touched only `docker/Dockerfile.web`, so its stale
      #    run redeployed the web while the API kept the newer revision, and
      #    the old bundle called seven endpoints the new API had removed
      #    (7x 404, every column empty). The same skew needs no race at all:
      #    an api-only PR that deletes a route would break the live web
      #    immediately. So a run now ships BOTH services or neither.
      #
      # Computed in shell rather than in nested `${{ }}` expressions on
      # purpose — GitHub expressions yield values, not booleans, and a subtly
      # wrong one here fails OPEN and deploys. Same reasoning as the
      # preflight-secrets job above.
      - name: Deploy gate
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          API_CHANGED: ${{ steps.filter.outputs.api }}
          WEB_CHANGED: ${{ steps.filter.outputs.web }}
          BRANCH: ${{ github.ref_name }}
          THIS_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # A failed query must be LOUD, not read as "no tip". `cut` would
          # otherwise mask a non-zero ls-remote behind an empty string.
          if ! remote=$(git ls-remote origin "refs/heads/${BRANCH}"); then
            echo "::error::Could not read refs/heads/${BRANCH} — refusing to guess."
            exit 1
          fi
          tip=$(printf '%s\n' "$remote" | cut -f1)

          echo "branch      : ${BRANCH}"
          echo "this commit : ${THIS_SHA}"
          echo "branch tip  : ${tip:-<none>}"

          fresh=true
          if [ -z "$tip" ]; then
            # Branch gone (deleted / force-pushed away). Deploying a commit
            # that is no longer on the branch is never what anyone wanted.
            fresh=false
            echo "::warning::${BRANCH} no longer exists — skipping deploy."
          elif [ "$tip" != "$THIS_SHA" ]; then
            fresh=false
            echo "::warning::Superseded by ${tip} — skipping deploy. The run for that commit deploys instead."
          fi

          changed=false
          if [ "$EVENT" = "workflow_dispatch" ] \
            || [ "$API_CHANGED" = "true" ] || [ "$WEB_CHANGED" = "true" ]; then
            changed=true
          fi

          deploy=false
          if [ "$fresh" = "true" ] && [ "$changed" = "true" ]; then
            deploy=true
          fi

          echo "fresh=${fresh}"   >> "$GITHUB_OUTPUT"
          echo "deploy=${deploy}" >> "$GITHUB_OUTPUT"
          echo "gate: fresh=${fresh} changed=${changed} -> deploy=${deploy}"

  # ===========================================================================
  # Job 1: Deploy API
  # ===========================================================================
  deploy-api:
    name: 🚀 Deploy API
    needs: changes
    # Coupled with the web deploy — see the Deploy gate step.
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    outputs:
      api_url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install database deps
        run: pnpm install --filter @nexora/database --frozen-lockfile

      # Clear any _prisma_migrations rows left in a failed state by an
      # earlier botched run. Without this, P3009 ("migrate found failed
      # migrations in the target database") blocks every subsequent
      # deploy until a human resolves it manually with prisma migrate
      # resolve. The names below are migrations that were either retired
      # by a later schema consolidation (so the dir no longer exists
      # but prod still has a failed row) or that we know to be
      # historically problematic. `|| true` keeps the step idempotent —
      # if the row is absent or already resolved, prisma exits non-zero
      # and we ignore it.
      - name: Resolve historically failed migrations
        env:
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          set +e
          for name in \
            20260507062500_conversations_schema \
            20260507062242_update_msg_schema \
            20260507020000_training_module_file_upload \
            20260923000000_seed_default_lead_sources \
            20260602150300_learning_course_links \
            20261110000000_consolidate_expenses_v1 \
            20261119000000_crm_archive_non_project \
          ; do
            echo "::group::resolve $name (rolled-back, ignore-if-absent)"
            pnpm --filter @nexora/database exec prisma migrate resolve --rolled-back "$name" || true
            echo "::endgroup::"
          done

      - name: Apply Prisma migrations to prod DB
        env:
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: pnpm --filter @nexora/database exec prisma migrate deploy

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build API Docker image
        run: |
          docker build \
            -f docker/Dockerfile.api \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/api:${{ github.sha }} \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/api:latest \
            .

      - name: Push API image to Artifact Registry
        run: |
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/api:${{ github.sha }}
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/api:latest

      - name: Deploy API to Cloud Run
        id: deploy
        run: |
          # Wrap `gcloud run deploy` in a retry loop. `docker push`
          # returns the moment its HTTP request finishes, but Artifact
          # Registry tag-by-name lookups from a different GCP API
          # (Cloud Run) can lag by a few seconds — so the first deploy
          # attempt occasionally fails with "Image '<sha>' not found"
          # even though the push succeeded. PR #413 hit exactly that
          # race. 3 attempts × 15s sleep ≈ 45s headroom.
          set +e
          attempt=1
          max_attempts=3
          while true; do
            gcloud run deploy ${{ env.API_SERVICE }} \
              --image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/api:${{ github.sha }} \
              --region=${{ env.REGION }} \
              --platform=managed \
              --allow-unauthenticated \
              --port=3001 \
              --memory=512Mi \
              --cpu=1 \
              --min-instances=0 \
              --max-instances=10 \
              --cpu-boost \
              --set-env-vars="^|^NODE_ENV=production|NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}|DATABASE_URL=${{ secrets.DATABASE_URL }}|DIRECT_URL=${{ secrets.DIRECT_URL }}|SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}|ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}|GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}|EMAIL_SERVICE_API_KEY=${{ secrets.EMAIL_SERVICE_API_KEY }}|EMAIL_SERVICE_URL=${{ secrets.EMAIL_SERVICE_URL }}|CRON_SECRET=${{ secrets.CRON_SECRET }}|LEAVE_NOTIFICATION_EXCLUDE=${{ secrets.LEAVE_NOTIFICATION_EXCLUDE }}|NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}|PORTAL_URL=https://manut.xyz|WORKFLOW_EMAIL_TOKEN_SECRET=${{ secrets.WORKFLOW_EMAIL_TOKEN_SECRET }}|GOOGLE_OAUTH_CLIENT_ID=${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}|GOOGLE_OAUTH_CLIENT_SECRET=${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}|GOOGLE_OAUTH_REDIRECT_URI=${{ secrets.GOOGLE_OAUTH_REDIRECT_URI }}|INTEGRATIONS_TOKEN_KEY=${{ secrets.INTEGRATIONS_TOKEN_KEY }}|POSTHOG_API_KEY=${{ secrets.POSTHOG_API_KEY }}|POSTHOG_HOST=${{ secrets.POSTHOG_HOST }}|POSTHOG_PERSONAL_API_KEY=${{ secrets.POSTHOG_PERSONAL_API_KEY }}|POSTHOG_PROJECT_ID=${{ secrets.POSTHOG_PROJECT_ID }}|VALIDATOR_MONITOR_GITHUB_TOKEN=${{ secrets.VALIDATOR_MONITOR_GITHUB_TOKEN }}|MARKETING_ANALYTICS_API_URL=${{ secrets.MARKETING_ANALYTICS_API_URL }}|MARKETING_ANALYTICS_PARTNER_IDS=${{ secrets.MARKETING_ANALYTICS_PARTNER_IDS }}|MARKETING_ANALYTICS_BACKFILL_FROM=${{ secrets.MARKETING_ANALYTICS_BACKFILL_FROM }}|GOOGLE_SHEETS_SA_KEY=${{ secrets.GOOGLE_SHEETS_SA_KEY }}|OW_TRACTION_SHEET_ID=${{ secrets.OW_TRACTION_SHEET_ID }}|OW_TRACTION_SHEET_RANGE=${{ secrets.OW_TRACTION_SHEET_RANGE }}|BOT_API_CLIENT_ID=${{ secrets.BOT_API_CLIENT_ID }}|BOT_API_BASE_URL=${{ secrets.BOT_API_BASE_URL }}|BOT_FX_CURRENCIES=${{ secrets.BOT_FX_CURRENCIES }}|BOT_FX_UNITS=${{ secrets.BOT_FX_UNITS }}|FX_FALLBACK_ENABLED=${{ secrets.FX_FALLBACK_ENABLED }}|FX_FALLBACK_BASE_URL=${{ secrets.FX_FALLBACK_BASE_URL }}|FX_FALLBACK_API_KEY=${{ secrets.FX_FALLBACK_API_KEY }}|ACCOUNTING_FIXED_ASSETS=${{ vars.ACCOUNTING_FIXED_ASSETS }}|MARKETING_ANALYTICS_ENABLED=${{ vars.MARKETING_ANALYTICS_ENABLED }}|VAPID_PUBLIC_KEY=${{ secrets.VAPID_PUBLIC_KEY }}|VAPID_PRIVATE_KEY=${{ secrets.VAPID_PRIVATE_KEY }}|VAPID_SUBJECT=${{ secrets.VAPID_SUBJECT }}"
            rc=$?
            if [ "$rc" -eq 0 ]; then break; fi
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::gcloud run deploy failed after $attempt attempts (last exit $rc)"
              exit "$rc"
            fi
            echo "Deploy attempt $attempt failed (exit $rc); retrying in 15s (likely Artifact Registry propagation)..."
            attempt=$((attempt + 1))
            sleep 15
          done
          set -e

          API_URL=$(gcloud run services describe ${{ env.API_SERVICE }} --region=${{ env.REGION }} --format='value(status.url)')
          echo "url=$API_URL" >> $GITHUB_OUTPUT
          echo "API deployed to: $API_URL"

      # ─────────────────────────────────────────────────────────────────────
      # Cloud Scheduler — daily Supabase storage snapshot (#266 Phase 4).
      # Idempotent: describe first, then create-or-update. Schedule is
      # 04:30 Asia/Bangkok (SGT/ICT) — quiet hours, just after the
      # PostHog telemetry sync. Authenticates the cron endpoint via the
      # X-Cron-Secret header instead of OIDC because the route already
      # speaks that protocol (verifyCronSecret in cron.controller.ts).
      # ─────────────────────────────────────────────────────────────────────
      - name: Provision storage-snapshot Cloud Scheduler job
        if: ${{ vars.SKIP_SCHEDULER_PROVISION != 'true' }}
        run: |
          set -euo pipefail
          JOB_NAME="storage-snapshot-daily"
          REGION="${{ env.REGION }}"
          API_URL="${{ steps.deploy.outputs.url }}"
          if [ -z "$API_URL" ]; then
            echo "::error::API_URL is empty; cannot provision scheduler job"
            exit 1
          fi
          ENDPOINT="${API_URL}/api/cron/sync-storage-snapshot"

          # Cloud Scheduler API may not be enabled on a fresh project. The
          # enable call is idempotent — no-op if already on. Activation
          # propagation can take up to ~60s, so we retry the gcloud
          # scheduler call below on SERVICE_DISABLED.
          echo "Ensuring Cloud Scheduler API is enabled..."
          gcloud services enable cloudscheduler.googleapis.com \
            --project="${{ env.PROJECT_ID }}"

          # `gcloud scheduler jobs create http` accepts `--headers` (full
          # replacement). `gcloud scheduler jobs update http` does NOT —
          # it expects `--update-headers` (merge) instead. Keep two
          # distinct flag arrays so the create + update paths each pass
          # the syntax that path actually understands.
          COMMON_FLAGS=(
            --location="$REGION"
            --schedule="30 4 * * *"
            --time-zone="Asia/Bangkok"
            --uri="$ENDPOINT"
            --http-method=POST
            --message-body="{}"
            --attempt-deadline=180s
            --description="Daily Supabase Storage usage snapshot for /admin Workspace Usage."
          )
          HEADERS="X-Cron-Secret=${{ secrets.CRON_SECRET }},Content-Type=application/json"

          provision_job() {
            if gcloud scheduler jobs describe "$JOB_NAME" --location="$REGION" >/dev/null 2>&1; then
              echo "Updating existing scheduler job $JOB_NAME"
              gcloud scheduler jobs update http "$JOB_NAME" \
                "${COMMON_FLAGS[@]}" \
                --update-headers="$HEADERS"
            else
              echo "Creating scheduler job $JOB_NAME"
              gcloud scheduler jobs create http "$JOB_NAME" \
                "${COMMON_FLAGS[@]}" \
                --headers="$HEADERS"
            fi
          }

          # Retry to absorb the API-activation propagation window. 5 tries
          # × 20s ≈ 100s headroom — well under the typical Cloud Scheduler
          # cold-start delay.
          attempt=1
          max_attempts=5
          while true; do
            if provision_job; then
              break
            fi
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::Cloud Scheduler provisioning failed after $attempt attempts"
              exit 1
            fi
            echo "Scheduler provisioning attempt $attempt failed; retrying in 20s..."
            attempt=$((attempt + 1))
            sleep 20
          done

      # ─────────────────────────────────────────────────────────────────────
      # Cloud Scheduler — ARIA knowledge-corpus auto-sync (#460).
      # Pull-based: re-derives `aria_knowledge_articles` from operational
      # tables (Leave Policies, Public Holidays, Partners, Projects,
      # Company Policies). 03:00 Asia/Bangkok keeps it out of business
      # hours and spaces it 30 min after the PII purge so the two
      # heaviest ARIA jobs don't overlap on DB connections.
      # ─────────────────────────────────────────────────────────────────────
      - name: Provision aria-knowledge-sync Cloud Scheduler job
        if: ${{ vars.SKIP_SCHEDULER_PROVISION != 'true' }}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          API_URL: ${{ steps.deploy.outputs.url }}
          REGION: ${{ env.REGION }}
          PROJECT_ID: ${{ env.PROJECT_ID }}
        run: |
          set -euo pipefail
          JOB_NAME="aria-knowledge-sync-daily"
          if [ -z "$API_URL" ]; then
            echo "::error::API_URL is empty; cannot provision scheduler job"
            exit 1
          fi
          ENDPOINT="${API_URL}/api/cron/aria-knowledge-sync"

          gcloud services enable cloudscheduler.googleapis.com \
            --project="$PROJECT_ID"

          # `create` uses --headers (full replace), `update` uses
          # --update-headers (merge). Keep distinct flag sets per path.
          COMMON_FLAGS=(
            --location="$REGION"
            --schedule="0 3 * * *"
            --time-zone="Asia/Bangkok"
            --uri="$ENDPOINT"
            --http-method=POST
            --message-body="{}"
            --attempt-deadline=300s
            --description="Daily ARIA knowledge corpus auto-sync."
          )
          HEADERS="X-Cron-Secret=${CRON_SECRET},Content-Type=application/json"

          provision_job() {
            if gcloud scheduler jobs describe "$JOB_NAME" --location="$REGION" >/dev/null 2>&1; then
              echo "Updating existing scheduler job $JOB_NAME"
              gcloud scheduler jobs update http "$JOB_NAME" \
                "${COMMON_FLAGS[@]}" \
                --update-headers="$HEADERS"
            else
              echo "Creating scheduler job $JOB_NAME"
              gcloud scheduler jobs create http "$JOB_NAME" \
                "${COMMON_FLAGS[@]}" \
                --headers="$HEADERS"
            fi
          }

          attempt=1
          max_attempts=5
          while true; do
            if provision_job; then
              break
            fi
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::Cloud Scheduler provisioning failed after $attempt attempts"
              exit 1
            fi
            echo "Scheduler provisioning attempt $attempt failed; retrying in 20s..."
            attempt=$((attempt + 1))
            sleep 20
          done

      # ─────────────────────────────────────────────────────────────────────
      # Cloud Scheduler — ARIA PII purge (#468).
      # Redacts `aria_query_logs.user_message` older than
      # ARIA_PII_RETENTION_DAYS (default 30). 02:30 Asia/Bangkok runs
      # 30 min before the knowledge sync.
      # ─────────────────────────────────────────────────────────────────────
      - name: Provision aria-purge-pii Cloud Scheduler job
        if: ${{ vars.SKIP_SCHEDULER_PROVISION != 'true' }}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          API_URL: ${{ steps.deploy.outputs.url }}
          REGION: ${{ env.REGION }}
          PROJECT_ID: ${{ env.PROJECT_ID }}
        run: |
          set -euo pipefail
          JOB_NAME="aria-purge-pii-daily"
          if [ -z "$API_URL" ]; then
            echo "::error::API_URL is empty; cannot provision scheduler job"
            exit 1
          fi
          ENDPOINT="${API_URL}/api/cron/aria-purge-pii"

          gcloud services enable cloudscheduler.googleapis.com \
            --project="$PROJECT_ID"

          COMMON_FLAGS=(
            --location="$REGION"
            --schedule="30 2 * * *"
            --time-zone="Asia/Bangkok"
            --uri="$ENDPOINT"
            --http-method=POST
            --message-body="{}"
            --attempt-deadline=120s
            --description="Daily redaction of aged ARIA query-log user prompts."
          )
          HEADERS="X-Cron-Secret=${CRON_SECRET},Content-Type=application/json"

          provision_job() {
            if gcloud scheduler jobs describe "$JOB_NAME" --location="$REGION" >/dev/null 2>&1; then
              echo "Updating existing scheduler job $JOB_NAME"
              gcloud scheduler jobs update http "$JOB_NAME" \
                "${COMMON_FLAGS[@]}" \
                --update-headers="$HEADERS"
            else
              echo "Creating scheduler job $JOB_NAME"
              gcloud scheduler jobs create http "$JOB_NAME" \
                "${COMMON_FLAGS[@]}" \
                --headers="$HEADERS"
            fi
          }

          attempt=1
          max_attempts=5
          while true; do
            if provision_job; then
              break
            fi
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::Cloud Scheduler provisioning failed after $attempt attempts"
              exit 1
            fi
            echo "Scheduler provisioning attempt $attempt failed; retrying in 20s..."
            attempt=$((attempt + 1))
            sleep 20
          done

      - name: Provision expense-monthly-reminders Cloud Scheduler job
        if: ${{ vars.SKIP_SCHEDULER_PROVISION != 'true' }}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          API_URL: ${{ steps.deploy.outputs.url }}
          REGION: ${{ env.REGION }}
          PROJECT_ID: ${{ env.PROJECT_ID }}
        run: |
          set -euo pipefail
          JOB_NAME="expense-monthly-reminders"
          if [ -z "$API_URL" ]; then
            echo "::error::API_URL is empty; cannot provision scheduler job"
            exit 1
          fi
          ENDPOINT="${API_URL}/api/cron/expense-monthly-reminders"

          gcloud services enable cloudscheduler.googleapis.com \
            --project="$PROJECT_ID"

          COMMON_FLAGS=(
            --location="$REGION"
            --schedule="0 9 22 * *"
            --time-zone="Asia/Bangkok"
            --uri="$ENDPOINT"
            --http-method=POST
            --message-body="{}"
            --attempt-deadline=300s
            --description="Monthly expense / allowance submission reminders (22nd, 09:00 SGT)."
          )
          HEADERS="X-Cron-Secret=${CRON_SECRET},Content-Type=application/json"

          provision_job() {
            if gcloud scheduler jobs describe "$JOB_NAME" --location="$REGION" >/dev/null 2>&1; then
              echo "Updating existing scheduler job $JOB_NAME"
              gcloud scheduler jobs update http "$JOB_NAME" \
                "${COMMON_FLAGS[@]}" \
                --update-headers="$HEADERS"
            else
              echo "Creating scheduler job $JOB_NAME"
              gcloud scheduler jobs create http "$JOB_NAME" \
                "${COMMON_FLAGS[@]}" \
                --headers="$HEADERS"
            fi
          }

          attempt=1
          max_attempts=5
          while true; do
            if provision_job; then
              break
            fi
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::Cloud Scheduler provisioning failed after $attempt attempts"
              exit 1
            fi
            echo "Scheduler provisioning attempt $attempt failed; retrying in 20s..."
            attempt=$((attempt + 1))
            sleep 20
          done

  # ===========================================================================
  # Job 2: Deploy Web (depends on API)
  # ===========================================================================
  deploy-web:
    name: Deploy Web
    runs-on: ubuntu-latest
    needs: [changes, deploy-api]
    if: |
      always() &&
      needs.changes.outputs.deploy == 'true' &&
      (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped')
    permissions:
      contents: read
      id-token: write

    outputs:
      web_url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Resolve API URL
        id: api_url
        run: |
          set -euo pipefail
          API_URL="${{ needs.deploy-api.outputs.api_url }}"
          if [ -z "$API_URL" ]; then
            echo "deploy-api skipped; reading existing Cloud Run API URL"
            API_URL=$(gcloud run services describe ${{ env.API_SERVICE }} \
              --region=${{ env.REGION }} \
              --format='value(status.url)')
          fi
          if [ -z "$API_URL" ]; then
            echo "::error::Could not resolve API URL for web deploy"
            exit 1
          fi
          echo "url=$API_URL" >> "$GITHUB_OUTPUT"
          echo "API_URL (runtime rewrite target) will be: ${API_URL}"

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build Web Docker image
        run: |
          docker build \
            -f docker/Dockerfile.web \
            --build-arg NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }} \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }} \
            --build-arg API_URL=${{ steps.api_url.outputs.url }} \
            --build-arg NEXT_PUBLIC_POSTHOG_KEY=${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }} \
            --build-arg NEXT_PUBLIC_POSTHOG_HOST=/ingest \
            --build-arg NEXT_PUBLIC_VAPID_PUBLIC_KEY="${{ secrets.VAPID_PUBLIC_KEY }}" \
            --build-arg NEXT_PUBLIC_ACCOUNTING_FIXED_ASSETS="${{ vars.ACCOUNTING_FIXED_ASSETS }}" \
            --build-arg NEXT_PUBLIC_MARKETING_ANALYTICS_ENABLED="${{ vars.MARKETING_ANALYTICS_ENABLED }}" \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/web:${{ github.sha }} \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/web:latest \
            .

      - name: Push Web image to Artifact Registry
        run: |
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/web:${{ github.sha }}
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/web:latest

      - name: Deploy Web to Cloud Run
        id: deploy
        run: |
          # Same retry pattern as the API deploy — Artifact Registry
          # propagation can lag a few seconds behind `docker push`. PR
          # #413 hit "Image '<sha>' not found" 3s after a successful
          # push.
          set +e
          attempt=1
          max_attempts=3
          while true; do
            gcloud run deploy ${{ env.WEB_SERVICE }} \
              --image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/web:${{ github.sha }} \
              --region=${{ env.REGION }} \
              --platform=managed \
              --allow-unauthenticated \
              --port=3000 \
              --memory=512Mi \
              --cpu=1 \
              --min-instances=0 \
              --max-instances=10 \
              --cpu-boost \
              --set-env-vars="NODE_ENV=production,API_URL=${{ steps.api_url.outputs.url }}"
            rc=$?
            if [ "$rc" -eq 0 ]; then break; fi
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::gcloud run deploy failed after $attempt attempts (last exit $rc)"
              exit "$rc"
            fi
            echo "Deploy attempt $attempt failed (exit $rc); retrying in 15s (likely Artifact Registry propagation)..."
            attempt=$((attempt + 1))
            sleep 15
          done
          set -e

          WEB_URL=$(gcloud run services describe ${{ env.WEB_SERVICE }} --region=${{ env.REGION }} --format='value(status.url)')
          echo "url=$WEB_URL" >> $GITHUB_OUTPUT
          echo "Web deployed to: $WEB_URL"

  # ===========================================================================
  # Job 3: Summary
  # ===========================================================================
  summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [changes, deploy-api, deploy-web]
    if: always()

    steps:
      - name: Print deployment URLs
        run: |
          echo "Deployment summary"
          echo "========================"
          echo "Deploy gate: deploy=${{ needs.changes.outputs.deploy }} (commit is branch tip: ${{ needs.changes.outputs.fresh }})"
          if [ "${{ needs.changes.outputs.fresh }}" = "false" ]; then
            echo "  -> SUPERSEDED: nothing was deployed by this run, on purpose."
          fi
          echo "API deploy: ${{ needs.deploy-api.result }} (changed: ${{ needs.changes.outputs.api }})"
          echo "Web deploy: ${{ needs.deploy-web.result }} (changed: ${{ needs.changes.outputs.web }})"
          echo "API URL: ${{ needs.deploy-api.outputs.api_url || 'unchanged (deploy skipped)' }}"
          echo "Web URL: ${{ needs.deploy-web.outputs.web_url || 'unchanged (deploy skipped)' }}"
          echo "========================"
