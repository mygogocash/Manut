# =============================================================================
# Intranet — Vercel production deploy (main only, single project)
#
# One Vercel project: Root Directory `apps/web`.
# Express is mounted via pages/api/[[...path]].js (same origin /api/*).
# Put API + web env vars on this project (DB, Supabase, secrets, public keys).
# Socket.IO / realtime messaging is not supported on the Fluid function.
#
# Required GitHub Secrets:
#   VERCEL_TOKEN
#   VERCEL_ORG_ID
#   VERCEL_PROJECT_ID
#
# If Vercel Git Integration is also enabled for this repo, disable auto-deploy
# on main (or turn it off) to avoid double deploys.
# =============================================================================

name: Deploy Web to Vercel

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/api/**"
      - "packages/ui/**"
      - "packages/types/**"
      - "packages/utils/**"
      - "packages/database/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "turbo.json"
      - "apps/web/vercel.json"
      - ".github/workflows/deploy-vercel.yml"
  workflow_dispatch:

concurrency:
  group: deploy-vercel-production
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: Deploy Production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: Production
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Verify secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            eval "val=\${$name:-}"
            if [ -z "$val" ]; then
              echo "::error::Missing secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      # Root Directory on the Vercel project is apps/web (API bridged in-process).
      - name: Pull Vercel project settings
        working-directory: apps/web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        working-directory: apps/web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy
        id: deploy
        working-directory: apps/web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          URL=$(vercel deploy --prebuilt --prod --regions sin1 --token="$VERCEL_TOKEN")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed: $URL"

      - name: Summary
        env:
          URL: ${{ steps.deploy.outputs.url }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          {
            echo "## Vercel deploy — Production (web + API)"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **Branch** | \`$REF\` |"
            echo "| **Commit** | \`${SHA:0:7}\` |"
            echo "| **URL** | $URL |"
          } >> "$GITHUB_STEP_SUMMARY"
